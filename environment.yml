# FlatMorphAI 1.0.0 -- conda environment.
#
#   conda env create -f environment.yml
#   conda activate flatmorphai
#   python -m pip install torch==2.5.1 torchvision==0.20.1 \
#       --index-url https://download.pytorch.org/whl/cu121
#   python -m pip install -r requirements.txt
#
# torch is deliberately NOT installed by this file: it must come from the
# pytorch.org index matching your CUDA, before requirements.txt. Every other
# package, with its exact version, is in requirements.txt -- a single source,
# so the two files cannot drift apart.
name: flatmorphai
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
